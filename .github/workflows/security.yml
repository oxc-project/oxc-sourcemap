name: Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: oxc-project/security-action@2ac862d109c9728f5bf439d249b69f68905a5de4 # v1.0.8

      - name: Generate security report
        if: ${{ !cancelled() }}
        run: zizmor --no-config --format sarif . > "${RUNNER_TEMP}/zizmor.sarif"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() }}
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
        env:
          # Preserve the scan identity from the former zizmor workflow.
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/zizmor.yml:zizmor
