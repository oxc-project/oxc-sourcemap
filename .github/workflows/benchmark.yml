name: Paired Chunk ID Searches
permissions: {}
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  benchmark:
    name: Benchmark (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, walltime]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
        with:
          cache-key: benchmark-paired-id-searches
          save-cache: false
          tools: cargo-codspeed
      - name: Build paired baseline and candidate
        env:
          BENCH_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cp .github/codspeed-experiments/prepare.py /tmp/prepare.py
          cp .github/codspeed-experiments/zero-offset.patch /tmp/zero-offset.patch
          bucket=walltime
          features=()
          if [ "$BENCH_MODE" = simulation ]; then bucket=analysis; features=(--features codspeed); fi
          git fetch --depth 1 origin 45265ceecd4c98b2ed964a9fca5ff25d1f735d46
          for variant in base head; do
            git checkout --detach 45265ceecd4c98b2ed964a9fca5ff25d1f735d46
            if [ "$variant" = head ]; then git apply /tmp/zero-offset.patch; fi
            python3 /tmp/prepare.py
            lock=()
            if [ "$variant" = head ]; then cp /tmp/baseline-Cargo.lock Cargo.lock; lock=(--locked); fi
            cargo codspeed build -m "$BENCH_MODE" --bench simple "${features[@]}" "${lock[@]}"
            cp "target/codspeed/$bucket/oxc_sourcemap/simple" "/tmp/$variant-bench"
            if [ "$variant" = base ]; then
              cp Cargo.lock /tmp/baseline-Cargo.lock
              git restore --worktree Cargo.toml Cargo.lock benches/simple.rs
            fi
          done
          find "target/codspeed/$bucket/oxc_sourcemap" -maxdepth 1 -type f -delete
          cp /tmp/base-bench "target/codspeed/$bucket/oxc_sourcemap/base"
          cp /tmp/head-bench "target/codspeed/$bucket/oxc_sourcemap/head"
          sha256sum /tmp/base-bench /tmp/head-bench
          cat > /tmp/run-paired.sh <<'SH'
          set -euo pipefail
          for phase in base1 head1 head2 base2; do
            case "$phase" in
              base*) binary=base ;;
              head*) binary=head ;;
            esac
            BENCH_LABEL="$phase" cargo codspeed run -m "$BENCH_MODE" --bench "$binary"
          done
          SH
      - name: Run benchmark
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea
        env:
          BENCH_MODE: ${{ matrix.mode }}
        timeout-minutes: 20
        with:
          mode: ${{ matrix.mode }}
          run: bash /tmp/run-paired.sh
